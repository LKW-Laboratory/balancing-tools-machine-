<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talking Character – Balancing of Tools (with branding)</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
  <style>
    :root{ --lab-name: "Technische Hochschule Rosenheim"; --ui-bg: rgba(255,255,255,0.9); }
    html, body { height:100%; margin:0; }
    body {
      background-image: url("logo-th-rosenheim-2019-clipart-lg.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;
      background-color: #0b0b0b;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    canvas { width:100%; height:100%; display:block; background: transparent; }
    .toolbar { position:absolute; top:16px; left:16px; z-index:20; display:flex; align-items:center; gap:10px;
      background: var(--ui-bg); padding:10px 12px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.25); backdrop-filter: blur(6px);}
    .btn { padding:10px 14px; border:none; border-radius:10px; background:#111; color:#fff; font-weight:600; cursor:pointer; }
    .lab-name { margin-left:6px; padding:8px 10px; border-radius:8px; font-weight:700; color:#111; background: rgba(255,255,255,0.7); white-space:nowrap; }
    .logo { position:absolute; top:16px; right:16px; z-index:20; height:48px; width:auto; object-fit:contain; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
    #hint { position:absolute; bottom:16px; left:16px; z-index:20; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.6); font-size:12px; background: rgba(0,0,0,.35); padding:6px 8px; border-radius:8px; }
    #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; z-index:10; background: rgba(0,0,0,.4); font-weight:600; letter-spacing:.2px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="audioButton" class="btn">🔊 Play Audio</button>
    <button id="muteButton" class="btn">🔈 Mute</button>
    <div class="lab-name" id="labName"></div>
  </div>

  <img class="logo" src="logo-th-rosenheim-2019-clipart-lg.png" alt="Lab Logo" />

  <div id="loading">Loading model…</div>
  <div id="hint">drag = orbit · wheel = zoom</div>
  <canvas id="renderCanvas"></canvas>
  <audio id="voice" src="Balancing of Tools machine audio.mp3" preload="auto"></audio>

  <script>
    const MODEL_FILE = "Balancing of Tools .glb";
    const AUDIO_FILE = "Balancing of Tools machine audio.mp3";

    const CAMERA_BACKOFF = 1.75;
    const BETA_DOWN_TILT = 0.10;
    const CAM_HEIGHT_FACTOR = 0.22;
    const YAW_OFFSET = Math.PI/2;

    const lab = document.getElementById('labName');
    const cssName = getComputedStyle(document.documentElement).getPropertyValue('--lab-name').trim().replace(/^"|"$/g,'');
    lab.textContent = cssName || "Your Lab Name";

    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, doNotHandleContextLost:true, alpha:true });
    const audio = document.getElementById("voice"); audio.src = AUDIO_FILE;

    let scene, root, idleGroup=null, talkGroups=[];

    function stopAllAnimations(sc){ (sc.animationGroups||[]).forEach(g=>{ try{ g.stop(); }catch(e){} }); sc.stopAllAnimations(); }
    function normalizeUpAxis(mesh){
      const bb = mesh.getHierarchyBoundingVectors(true);
      const sz = bb.max.subtract(bb.min);
      if (sz.z > sz.y * 1.5) mesh.rotate(BABYLON.Axis.X, Math.PI/2, BABYLON.Space.LOCAL);
      const bb2 = mesh.getHierarchyBoundingVectors(true);
      if (bb2.max.y < 0) mesh.rotate(BABYLON.Axis.Z, Math.PI, BABYLON.Space.LOCAL);
    }
    function chooseFrontAndOffset(mesh){
      const candidates=[0,Math.PI/2,Math.PI,3*Math.PI/2];
      let best=0,bestDepth=Infinity;
      for(const a of candidates){
        mesh.rotation.y=a;
        const bb=mesh.getHierarchyBoundingVectors(true);
        const depth=bb.max.z-bb.min.z;
        if(depth<bestDepth){ bestDepth=depth; best=a; }
      }
      mesh.rotation.y = best + YAW_OFFSET;
      return mesh.rotation.y;
    }
    function centerAndScale(mesh){
      const bb=mesh.getHierarchyBoundingVectors(true);
      const c=bb.min.add(bb.max).scale(0.5);
      mesh.position=mesh.position.subtract(c);
      const size=bb.max.subtract(bb.min);
      const maxDim=Math.max(size.x,size.y,size.z);
      if(maxDim>0){
        const s=2.0/maxDim;
        mesh.scaling=new BABYLON.Vector3(s,s,s);
      }
    }
    function placeCameraFromFacing(camera, mesh, facingAngle){
      const bb=mesh.getHierarchyBoundingVectors(true);
      const center=bb.min.add(bb.max).scale(0.5);
      const size=bb.max.subtract(bb.min);
      const maxDim=Math.max(size.x,size.y,size.z);
      const forwardLocal=new BABYLON.Vector3(0,0,1);
      const forward=BABYLON.Vector3.TransformNormal(forwardLocal,BABYLON.Matrix.RotationY(facingAngle));
      const dist=Math.max(2.0,maxDim*CAMERA_BACKOFF);
      const camPos=center.subtract(forward.scale(dist));
      camPos.y=center.y+maxDim*CAM_HEIGHT_FACTOR;
      camera.setTarget(center);
      camera.setPosition(camPos);
      camera.alpha=Math.atan2(-forward.x,-forward.z);
      camera.beta=Math.PI/2-BETA_DOWN_TILT;
      camera.lowerBetaLimit=Math.PI/2-0.45;
      camera.upperBetaLimit=Math.PI/2+0.35;
      camera.lowerRadiusLimit=maxDim*0.7;
      camera.upperRadiusLimit=maxDim*5;
    }

    async function createScene(){
      scene=new BABYLON.Scene(engine);
      scene.clearColor=new BABYLON.Color4(0,0,0,0);
      const camera=new BABYLON.ArcRotateCamera("camera",0,Math.PI/2,3.0,BABYLON.Vector3.Zero(),scene);
      camera.attachControl(canvas,true);
      const light=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(0,1,0),scene);
      light.intensity=1.25;
      const result=await BABYLON.SceneLoader.ImportMeshAsync("","./","Balancing of Tools .glb",scene);
      root=result.meshes[0];
      result.meshes.forEach(m=>{ if(m.rotationQuaternion) m.rotationQuaternion=null; });
      normalizeUpAxis(root);
      stopAllAnimations(scene);
      const facing=chooseFrontAndOffset(root);
      centerAndScale(root);
      placeCameraFromFacing(camera,root,facing);
      const groups=scene.animationGroups||[];
      const has=(g,arr)=>arr.some(w=>g.name.toLowerCase().includes(w));
      idleGroup=groups.find(g=>has(g,["idle","stand","breath","breathe","rest"]));
      talkGroups=groups.filter(g=>has(g,["wolf3d","viseme","lip","phoneme","talk","speak","mouth"]));
      if(talkGroups.length===0) talkGroups=groups.filter(g=>g!==idleGroup);
      if(idleGroup) idleGroup.start(true,1.0,idleGroup.from,idleGroup.to,true);
      document.getElementById("loading").style.display="none";
      return scene;
    }
    createScene().then(()=>engine.runRenderLoop(()=>scene&&scene.render()));
    window.addEventListener("resize",()=>engine.resize());

    const playBtn=document.getElementById("audioButton");
    const muteBtn=document.getElementById("muteButton");
    function startTalking(){ if(idleGroup) idleGroup.stop(); talkGroups.forEach(g=>{ try{ g.stop(); }catch(e){} g.start(false,1.0,g.from,g.to,false); }); }
    function stopTalking(){ talkGroups.forEach(g=>g.stop()); if(idleGroup) idleGroup.start(true,1.0,idleGroup.from,idleGroup.to,true); }
    playBtn.addEventListener("click", async ()=>{ try{ audio.currentTime=0; await audio.play(); }catch(e){ console.warn(e); } startTalking(); });
    audio.addEventListener("ended", stopTalking);
    let muted=false;
    muteBtn.addEventListener("click",()=>{ muted=!muted; audio.muted=muted; muteBtn.textContent=muted?"🔇 Unmute":"🔈 Mute"; });
  </script>
</body>
</html>
